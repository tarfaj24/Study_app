{% extends "layout_form.html" %}

{% block navigation %}
    <nav class="navbar navbar-expand-lg bg-body-tertiary" id = "main_nav">
        <div class="container-fluid">
            <a class="navbar-brand" href="#" id = 'logo'>Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href= "/login">Log In</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/register">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
{% endblock %}

{% block main %}
    <main>
        <div class="container">
            <form action="/login" method="POST" class = "needs-validation" novalidate >
                <div class="mb-3" id = 'username_form_container'>
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" aria-describedby="username" name = "username" autocomplete="off" autocapitalize="off" required>
                </div>
                <div class="mb-3" id = 'password_form_container'>
                    <label for="password" class="form-label" autocomplete="off">Password</label>
                    <input type="password" class="form-control" id="password" name = "password" required>
                </div>
        
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

        </div>
    </main>
{% endblock %}

{% block script %}
    <script type="module" src=static/js/authorization/form_login.js></script>
{% endblock %}
